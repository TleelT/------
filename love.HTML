<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เค้ามีอะไรจะบอกเธอนะ...</title>
    <style>
        body {
            background-color: #ffe6eb;
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding-top: 100px;
            color: #d63384;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { font-size: 2.5rem; }
        p { font-size: 1.2rem; color: #6c757d; }
        .btn {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }
        .btn:hover { background-color: #c9184a; transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="box">
        <h1>❤️ ถึง...คนดีของเค้า ❤️</h1>
        <p>แค่อยากจะบอกว่า... รักเธอนะครับ</p>
        <p>ขอบคุณที่อยู่ข้างกันนะ วันนี้และวันต่อๆ ไปก็อยู่ให้บ่นไปนานๆ เลยนะคุณแฟน</p>
        <button class="btn" onclick="alert('งื้อออ แฟนใครเนี่ยน่ารักจัง! รับทราบแล้วกอดทีนึงดิ้ 🥰')">กดถ้ารักเค้าเหมือนกัน</button>
    </div>

</body>
</html>
